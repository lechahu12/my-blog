<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 - My Blog</title>
  <meta name="description" content="방향키로 숫자 타일을 밀어서 합치는 2048 퍼즐 게임입니다.">
  <link rel="canonical" href="https://lechahu12.github.io/my-blog/2048.html">
  <meta property="og:title" content="2048 - My Blog">
  <meta property="og:description" content="방향키로 숫자 타일을 밀어서 합치는 2048 퍼즐 게임입니다.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://lechahu12.github.io/my-blog/2048.html">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="2048 - My Blog">
  <meta name="twitter:description" content="방향키로 숫자 타일을 밀어서 합치는 2048 퍼즐 게임입니다.">
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/game-2048.css">
</head>
<body>
  <a class="skip-link" href="#main-content">본문으로 바로가기</a>
  <header class="site-header">
    <a class="brand" href="index.html">My Blog</a>
    <button id="theme-toggle" aria-label="테마 전환">🌓</button>
  </header>

  <main id="main-content">
    <a class="back-link" href="index.html">&larr; 블로그로</a>

    <div class="page-intro">
      <h1>2048</h1>
      <p>방향키(←↑↓→)로 타일을 밀어 같은 숫자를 합쳐보세요. 타일 하나가 2048이 되면 승리입니다.</p>
    </div>

    <section class="game-2048" aria-label="2048 게임">
      <div class="game-top-bar">
        <div class="scoreboard">
          <div class="score-box">
            <span class="score-label">SCORE</span>
            <span class="score-value" id="score">0</span>
          </div>
          <div class="score-box">
            <span class="score-label">BEST</span>
            <span class="score-value" id="best-score">0</span>
          </div>
        </div>
        <button id="new-game-btn" class="new-game-btn" type="button">새 게임</button>
      </div>

      <div class="board-wrap">
        <div id="board" class="board"></div>
        <div id="game-message" class="game-message" hidden>
          <p id="game-message-text"></p>
          <div class="game-message-actions">
            <button id="keep-going-btn" class="keep-going-btn" type="button" hidden>계속하기</button>
            <button id="try-again-btn" class="try-again-btn" type="button">새 게임</button>
          </div>
        </div>
      </div>

      <p class="game-hint">모바일에서는 보드를 스와이프해서 움직일 수 있습니다.</p>
      <p id="game-status" class="sr-only" aria-live="polite"></p>
    </section>
  </main>

  <script src="js/theme.js"></script>
  <script src="js/game-2048.js"></script>
</body>
</html>
