<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>2048</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <a class="back-link" href="../../index.html">← 블로그로 돌아가기</a>

  <header class="header">
    <h1 class="title">2048</h1>
    <div class="scores">
      <div class="score-box">
        <span class="score-label">SCORE</span>
        <span id="score" class="score-value" aria-live="polite">0</span>
      </div>
      <div class="score-box">
        <span class="score-label">BEST</span>
        <span id="best-score" class="score-value" aria-live="polite">0</span>
      </div>
    </div>
  </header>

  <div class="controls">
    <p class="hint">방향키 또는 스와이프로 타일을 움직여 같은 숫자를 합쳐보세요.</p>
    <button id="restart-btn" class="restart-btn" type="button">새 게임</button>
  </div>

  <div class="board-container">
    <div id="board" class="board"></div>

    <div id="overlay" class="overlay hidden">
      <p id="overlay-message" class="overlay-message"></p>
      <div class="overlay-buttons">
        <button id="overlay-continue-btn" class="overlay-btn hidden" type="button">계속하기</button>
        <button id="overlay-restart-btn" class="overlay-btn" type="button">다시 시작</button>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
